<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control</title>
    <link rel="stylesheet" href="../styles/control.css" />
  </head>
  <body>
    <header id="app-header">
      <div id="part-number"></div>
      <div id="part-title"></div>
    </header>

    <main id="text-container"></main>

    <footer id="app-footer">
      <div id="progress-container">
        <div id="progress-bar"></div>
      </div>

      <div id="footer-controls">
        <div id="controls">
          <button id="prev-btn" aria-label="Previous part"></button>
          <button id="next-btn" aria-label="Next part"></button>
        </div>

        <div id="part-counter">1/3</div>
      </div>
    </footer>

    <script src="../scripts/control.js"></script>
  </body>
</html>
