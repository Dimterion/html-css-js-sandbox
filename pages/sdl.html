<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles/sdl.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spooky Dev Life</title>
  </head>
  <body>
    <main class="stage">
      <div class="progress" id="progress"></div>

      <div class="slide-wrap">
        <div class="skull" id="skull" aria-hidden="true" hidden>💀</div>
        <p class="slide" id="slide" aria-live="polite" aria-atomic="true"></p>
      </div>

      <div class="controls">
        <button id="next">Next 🎃</button>
        <button id="restart" hidden>Restart 🕯️</button>
      </div>
    </main>
    <script src="../scripts/sdl.js"></script>
  </body>
</html>
